<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Context — Weather Activity Ranking Service</title>
  <desc id="desc">Client talks to the NestJS service; warm path uses PostgreSQL; Open-Meteo is for refresh and cold-start only.</desc>
  <rect width="920" height="320" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="460" y="36" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="18" font-weight="700" fill="#24292f">Context — Weather Activity Ranking Service</text>

  <!-- Client -->
  <g transform="translate(70,130)">
    <circle cx="40" cy="0" r="10" fill="none" stroke="#24292f" stroke-width="2"/>
    <line x1="40" y1="10" x2="40" y2="40" stroke="#24292f" stroke-width="2"/>
    <line x1="20" y1="22" x2="60" y2="22" stroke="#24292f" stroke-width="2"/>
    <line x1="40" y1="40" x2="22" y2="62" stroke="#24292f" stroke-width="2"/>
    <line x1="40" y1="40" x2="58" y2="62" stroke="#24292f" stroke-width="2"/>
    <text x="40" y="88" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#24292f">Client</text>
  </g>

  <!-- App -->
  <rect x="220" y="118" width="260" height="72" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="350" y="148" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" font-weight="700" fill="#24292f">Activity Ranking Service</text>
  <text x="350" y="170" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#57606a">Node.js / TypeScript · NestJS</text>

  <!-- Postgres -->
  <ellipse cx="720" cy="90" rx="70" ry="18" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <path d="M650 90 v40" fill="none" stroke="#24292f" stroke-width="2"/>
  <path d="M790 90 v40" fill="none" stroke="#24292f" stroke-width="2"/>
  <path d="M650 130 C650 148 790 148 790 130" fill="none" stroke="#24292f" stroke-width="2"/>
  <text x="720" y="118" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#24292f">PostgreSQL</text>

  <!-- Open-Meteo cloud -->
  <g transform="translate(650,200)">
    <path d="M30 50 C10 50 5 35 20 28 C20 12 45 8 55 20 C65 8 95 12 95 28 C110 30 110 50 90 50 Z" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
    <text x="55" y="42" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="12" font-weight="700" fill="#24292f">Open-Meteo</text>
  </g>
  <text x="720" y="275" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#57606a">forecast + geocoding</text>

  <!-- arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#24292f"/>
    </marker>
  </defs>
  <line x1="130" y1="154" x2="216" y2="154" stroke="#24292f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="173" y="145" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#57606a">GraphQL + health</text>

  <path d="M480 140 H620 V110" fill="none" stroke="#24292f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="132" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#57606a">warm path (read / upsert)</text>

  <path d="M480 170 H620 V230" fill="none" stroke="#24292f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="560" y="200" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#57606a">refresh + cold-start only</text>
</svg>
