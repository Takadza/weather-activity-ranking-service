<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540" role="img" aria-labelledby="title desc">
  <title id="title">Modular monolith - internal modules</title>
  <desc id="desc">Layered Nest modules from GraphQL transport down to store and Open-Meteo client.</desc>
  <rect width="780" height="540" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="390" y="34" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="18" font-weight="700" fill="#24292f">Modular monolith - internal modules</text>

  <defs>
    <marker id="arrM" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#24292f"/>
    </marker>
  </defs>

  <rect x="40" y="55" width="700" height="355" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="390" y="80" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#57606a">Activity Ranking Service</text>

  <rect x="255" y="100" width="270" height="48" rx="4" fill="#fff" stroke="#24292f" stroke-width="2"/>
  <text x="390" y="129" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" font-weight="700" fill="#24292f">graphql (transport)</text>

  <line x1="390" y1="148" x2="390" y2="172" stroke="#24292f" stroke-width="2" marker-end="url(#arrM)"/>

  <rect x="220" y="175" width="340" height="48" rx="4" fill="#fff" stroke="#24292f" stroke-width="2"/>
  <text x="390" y="204" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="14" font-weight="700" fill="#24292f">activity-ranking (orchestration)</text>

  <!-- bus to domain -->
  <line x1="390" y1="223" x2="390" y2="240" stroke="#24292f" stroke-width="2"/>
  <line x1="160" y1="240" x2="620" y2="240" stroke="#24292f" stroke-width="2"/>
  <line x1="160" y1="240" x2="160" y2="258" stroke="#24292f" stroke-width="2" marker-end="url(#arrM)"/>
  <line x1="390" y1="240" x2="390" y2="258" stroke="#24292f" stroke-width="2" marker-end="url(#arrM)"/>
  <line x1="620" y1="240" x2="620" y2="258" stroke="#24292f" stroke-width="2" marker-end="url(#arrM)"/>

  <rect x="60" y="260" width="200" height="52" rx="4" fill="#fff" stroke="#24292f" stroke-width="2"/>
  <text x="160" y="291" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#24292f">scoring (pure)</text>

  <rect x="290" y="260" width="200" height="52" rx="4" fill="#fff" stroke="#24292f" stroke-width="2"/>
  <text x="390" y="291" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#24292f">geocoding</text>

  <rect x="520" y="260" width="200" height="52" rx="4" fill="#fff" stroke="#24292f" stroke-width="2"/>
  <text x="620" y="291" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#24292f">refresh (worker)</text>

  <!-- bus to I/O -->
  <line x1="390" y1="312" x2="390" y2="330" stroke="#24292f" stroke-width="2"/>
  <line x1="260" y1="330" x2="520" y2="330" stroke="#24292f" stroke-width="2"/>
  <line x1="260" y1="330" x2="260" y2="348" stroke="#24292f" stroke-width="2" marker-end="url(#arrM)"/>
  <line x1="520" y1="330" x2="520" y2="348" stroke="#24292f" stroke-width="2" marker-end="url(#arrM)"/>

  <rect x="160" y="350" width="200" height="52" rx="4" fill="#fff" stroke="#24292f" stroke-width="2"/>
  <text x="260" y="381" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#24292f">store</text>

  <rect x="420" y="350" width="200" height="52" rx="4" fill="#fff" stroke="#24292f" stroke-width="2"/>
  <text x="520" y="381" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#24292f">open-meteo (client)</text>

  <line x1="260" y1="402" x2="260" y2="448" stroke="#24292f" stroke-width="2" marker-end="url(#arrM)"/>
  <line x1="520" y1="402" x2="520" y2="448" stroke="#24292f" stroke-width="2" marker-end="url(#arrM)"/>

  <ellipse cx="260" cy="470" rx="78" ry="16" fill="#fff" stroke="#24292f" stroke-width="2"/>
  <path d="M182 470 v24" fill="none" stroke="#24292f" stroke-width="2"/>
  <path d="M338 470 v24" fill="none" stroke="#24292f" stroke-width="2"/>
  <path d="M182 494 C182 510 338 510 338 494" fill="none" stroke="#24292f" stroke-width="2"/>
  <text x="260" y="490" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="12" font-weight="700" fill="#24292f">PostgreSQL</text>

  <g transform="translate(460,445)">
    <path d="M20 36 C4 36 0 24 14 18 C14 4 36 0 48 12 C58 0 86 4 86 18 C100 20 100 36 84 36 Z" fill="#fff" stroke="#24292f" stroke-width="2"/>
    <text x="50" y="30" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="12" font-weight="700" fill="#24292f">Open-Meteo</text>
  </g>

  <text x="390" y="525" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#57606a">Dependency details are listed in the table under this figure in docs/02.</text>
</svg>
