<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL ERD - v1 tables</title>
  <desc id="desc">Entity relationships for Location, ForecastDay, GeocodeCache, and RefreshMeta. Scores are compute-on-read (no score table).</desc>
  <rect width="920" height="520" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="460" y="32" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="18" font-weight="700" fill="#24292f">PostgreSQL ERD (v1)</text>
  <text x="460" y="52" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#57606a">Scores are compute-on-read - no ActivityScoreDay table</text>

  <defs>
    <marker id="arrE" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#24292f"/>
    </marker>
  </defs>

  <!-- Location -->
  <rect x="320" y="80" width="280" height="168" rx="6" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <rect x="320" y="80" width="280" height="32" rx="6" fill="#24292f"/>
  <rect x="320" y="100" width="280" height="12" fill="#24292f"/>
  <text x="460" y="102" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Location</text>
  <text x="336" y="132" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">id : uuid PK</text>
  <text x="336" y="150" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">name, country?, admin1?</text>
  <text x="336" y="168" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">latitude, longitude UK</text>
  <text x="336" y="186" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">tracked : boolean</text>
  <text x="336" y="204" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#57606a">created_at, updated_at</text>
  <text x="336" y="230" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#57606a">@@unique(lat, lon) - @@index(tracked)</text>

  <!-- ForecastDay -->
  <rect x="40" y="300" width="300" height="180" rx="6" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <rect x="40" y="300" width="300" height="32" rx="6" fill="#24292f"/>
  <rect x="40" y="320" width="300" height="12" fill="#24292f"/>
  <text x="190" y="322" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#ffffff">ForecastDay</text>
  <text x="56" y="352" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">id : uuid PK</text>
  <text x="56" y="370" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">location_id : uuid FK</text>
  <text x="56" y="388" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">forecast_date : date</text>
  <text x="56" y="406" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">temp, precip, wind, snow, waves&</text>
  <text x="56" y="424" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">weather_code, raw_json?, fetched_at</text>
  <text x="56" y="456" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#57606a">@@unique(location_id, forecast_date)</text>

  <!-- GeocodeCache -->
  <rect x="580" y="300" width="300" height="160" rx="6" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <rect x="580" y="300" width="300" height="32" rx="6" fill="#24292f"/>
  <rect x="580" y="320" width="300" height="12" fill="#24292f"/>
  <text x="730" y="322" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#ffffff">GeocodeCache</text>
  <text x="596" y="352" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">id : uuid PK</text>
  <text x="596" y="370" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">query_normalized : string UK</text>
  <text x="596" y="388" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">results_json : jsonb</text>
  <text x="596" y="406" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">best_location_id : uuid FK?</text>
  <text x="596" y="424" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">fetched_at</text>
  <text x="596" y="444" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#57606a">optional best-match -> Location</text>

  <!-- RefreshMeta -->
  <rect x="360" y="300" width="180" height="120" rx="6" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <rect x="360" y="300" width="180" height="32" rx="6" fill="#24292f"/>
  <rect x="360" y="320" width="180" height="12" fill="#24292f"/>
  <text x="450" y="322" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" font-weight="700" fill="#ffffff">RefreshMeta</text>
  <text x="376" y="352" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">id : int PK (=1)</text>
  <text x="376" y="370" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">last_success_at?</text>
  <text x="376" y="388" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">last_attempt_at?</text>
  <text x="376" y="406" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#24292f">last_error?</text>

  <!-- Relationships -->
  <line x1="340" y1="248" x2="190" y2="300" stroke="#24292f" stroke-width="2" marker-end="url(#arrE)"/>
  <text x="220" y="275" font-family="Verdana, Geneva, sans-serif" font-size="11" font-weight="700" fill="#24292f">1 - *</text>

  <line x1="580" y1="248" x2="730" y2="300" stroke="#24292f" stroke-width="2" marker-end="url(#arrE)"/>
  <text x="640" y="275" font-family="Verdana, Geneva, sans-serif" font-size="11" font-weight="700" fill="#24292f">0..1 - *</text>

  <text x="450" y="280" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#57606a">singleton (no FK)</text>

  <text x="460" y="505" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="11" fill="#57606a">Canonical detail: docs/contracts/prisma-schema.md - prisma/schema.prisma</text>
</svg>
