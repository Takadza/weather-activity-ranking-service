services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wars
      POSTGRES_PASSWORD: wars
      POSTGRES_DB: wars
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wars -d wars"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - wars_pg:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3000:3000"
    environment: &app_env
      DATABASE_URL: postgresql://wars:wars@db:5432/wars?schema=public
      PORT: "3000"
      REFRESH_INTERVAL_MS: "21600000"
      REFRESH_CONCURRENCY: "5"
      OPEN_METEO_TIMEOUT_MS: "5000"
      COLD_START_TIMEOUT_MS: "3000"
      STALE_AFTER_SECONDS: "21600"
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build: .
    environment:
      <<: *app_env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["node", "dist/worker.js"]

volumes:
  wars_pg:
